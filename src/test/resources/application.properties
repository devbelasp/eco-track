spring.application.name=eco-track-ms

# Banco em memoria (H2 em modo PostgreSQL): os testes rodam sem Docker e sem rede
spring.datasource.url=jdbc:h2:mem:ecotrack;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.web.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
