spring.application.name=eco-track-ms

# Conexao dos testes. Com as variaveis TEST_DATABASE_* (CI) usa PostgreSQL real;
# sem elas (execucao local) usa H2 em memoria, sem precisar de Docker.
spring.datasource.url=${TEST_DATABASE_URL:jdbc:h2:mem:ecotrack;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DATABASE_USER:sa}
spring.datasource.password=${TEST_DATABASE_PWD:}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.web.error.include-stacktrace=never
management.endpoints.web.exposure.include=health