spring.application.name=eco-track-ms

# Porta da aplicacao (padrao 8080)
server.port=${SERVER_PORT:8080}

# Conexao com o banco: vem de variaveis de ambiente (nada de senha no codigo)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PWD}

# O Flyway cria e versiona o schema; o Hibernate apenas valida
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Nao expor stacktrace nas respostas de erro
spring.web.error.include-stacktrace=never

# Health check usado pelo Docker, pelo pipeline e pelo Azure
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
