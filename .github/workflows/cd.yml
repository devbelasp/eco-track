# CD - Entrega Continua
# Dispara a cada push em develop (staging) ou main (producao), ou seja,
# quando um Pull Request e aprovado e mesclado.
#   1) roda o CI (build + testes)
#   2) constroi a imagem Docker e publica no Docker Hub
# (os jobs de deploy no Azure sao adicionados na proxima etapa)
name: CD

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: devbelasp
  IMAGE_NAME: devbelasp/eco-track

jobs:
  ci:
    name: CI (build e testes)
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Publicar imagem no Docker Hub
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Duas tags: o SHA do commit (versao exata) e o nome da branch (develop ou main)
      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
