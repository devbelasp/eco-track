# CD - Entrega Continua
# Dispara a cada push em develop (staging) ou main (producao), ou seja,
# quando um Pull Request e mesclado.
#   1) roda o CI (build + testes)
#   2) constroi a imagem Docker e publica no Docker Hub
#   3) develop -> deploy no Web App de STAGING
#      main    -> deploy no Web App de PRODUCAO (com aprovacao, se configurada)
#   4) smoke test: confirma que /actuator/health responde UP apos o deploy
name: CD

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: devbelasp
  IMAGE_NAME: devbelasp/eco-track

jobs:
  ci:
    name: CI (build e testes)
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Publicar imagem no Docker Hub
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Duas tags: o SHA do commit (versao exata) e o nome da branch (develop ou main)
      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy em staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    # O Environment "staging" guarda o secret e a variavel deste ambiente
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Deploy da imagem no Azure Web App (staging)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # O app pode levar alguns minutos para reiniciar (e o banco para acordar),
      # por isso o curl tenta de novo varias vezes antes de falhar.
      - name: Smoke test (health check)
        env:
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          RESPOSTA=$(curl --fail --silent --show-error --max-time 30 \
            --retry 20 --retry-delay 15 --retry-all-errors \
            "$WEBAPP_URL/actuator/health")
          echo "$RESPOSTA"
          echo "$RESPOSTA" | grep -q '"status":"UP"'

  deploy-production:
    name: Deploy em producao
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    # O Environment "production" pode exigir aprovacao manual antes de rodar
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Deploy da imagem no Azure Web App (producao)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke test (health check)
        env:
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          RESPOSTA=$(curl --fail --silent --show-error --max-time 30 \
            --retry 20 --retry-delay 15 --retry-all-errors \
            "$WEBAPP_URL/actuator/health")
          echo "$RESPOSTA"
          echo "$RESPOSTA" | grep -q '"status":"UP"'
