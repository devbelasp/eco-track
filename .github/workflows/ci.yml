# CI - Integracao Continua
# Roda a cada Pull Request para develop/main e tambem pode ser chamado por
# outros workflows (o de deploy reutiliza este para garantir build + testes).
name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # "verify" compila, roda os testes unitarios e de integracao e empacota o jar
      - name: Build e testes automatizados
        run: mvn -B verify

      - name: Publicar relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports
          if-no-files-found: ignore

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Valida o Dockerfile em todo PR. Nao publica nada (push: false)
      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: eco-track:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
