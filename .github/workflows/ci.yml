# CI - Integracao Continua
# Roda a cada Pull Request para develop/main e tambem pode ser chamado por
# outros workflows (o de CD reutiliza este para garantir build + testes).
name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest

    # PostgreSQL real, usado pelos testes de integracao (mesmo banco dos ambientes)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecotrack_test
          POSTGRES_USER: ecotrack
          POSTGRES_PASSWORD: ecotrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecotrack -d ecotrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Os testes leem a conexao destas variaveis; sem elas (execucao local), usam H2
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ecotrack_test
      TEST_DATABASE_USER: ecotrack
      TEST_DATABASE_PWD: ecotrack_test

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # "verify" compila, roda os testes unitarios e de integracao (contra o PostgreSQL acima)
      # e empacota o jar
      - name: Build e testes automatizados
        run: mvn -B verify

      - name: Publicar relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports
          if-no-files-found: ignore

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    # Apenas em Pull Request. No CD a imagem e construida e publicada pelo proprio CD.
    if: github.event_name == 'pull_request'
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Valida o Dockerfile em todo PR. Nao publica nada (push: false)
      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: eco-track:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
